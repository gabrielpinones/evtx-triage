name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Host tests
        run: cargo test --locked

      - name: Build target binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package release archive
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
        run: |
          TAG="${REF_NAME}"
          DIRNAME="evtx-triage-${TAG}-${TARGET}"
          mkdir -p "${DIRNAME}"

          if [[ "${TARGET}" == *"windows"* ]]; then
            BIN="target/${TARGET}/release/evtx-triage.exe"
          else
            BIN="target/${TARGET}/release/evtx-triage"
          fi

          cp "${BIN}" "${DIRNAME}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${DIRNAME}/"

          if [[ "${ARCHIVE_FORMAT}" == "tar.gz" ]]; then
            ARCHIVE_NAME="${DIRNAME}.tar.gz"
            tar -czf "${ARCHIVE_NAME}" "${DIRNAME}"
          elif [[ "${ARCHIVE_FORMAT}" == "zip" ]]; then
            ARCHIVE_NAME="${DIRNAME}.zip"
            7z a "${ARCHIVE_NAME}" "${DIRNAME}"
          fi

          mkdir -p dist
          mv "${ARCHIVE_NAME}" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Compute checksums and create GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum evtx-triage-* > SHA256SUMS
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            evtx-triage-* SHA256SUMS
